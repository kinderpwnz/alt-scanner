name: xs-signals

on:
  schedule:
    - cron: "2,32 * * * *"        # кожні 30 хв: о :02 і :32 (одразу після закриття свічок 30m/1h/4h/1D)
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = перевірка підключень · dryrun = показати сигнали за останні 6 свічок (без Telegram) · sendlast = те саме, але надіслати в Telegram · run = звичайний запуск"
        type: choice
        options: [selftest, dryrun, sendlast, run]
        default: selftest

permissions:
  contents: read

concurrency:
  group: xs-signals
  cancel-in-progress: false

jobs:
  xs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # стан «що вже надсилали» — щоб не було повторів, навіть якщо запуск запізнився або два запуски накладаються
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .xs_state
          key: xs-state-${{ github.run_id }}
          restore-keys: |
            xs-state-
      - name: Scan
        env:
          MODE: ${{ inputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # --- необов'язкові налаштування: Settings → Secrets and variables → Actions → Variables ---
          DEPOSIT: ${{ secrets.DEPOSIT || vars.DEPOSIT }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MAX_POS_PCT: ${{ vars.MAX_POS_PCT }}
          TOP_N: ${{ vars.TOP_N }}
          SOURCES: ${{ vars.SOURCES }}
          TV_EXCHANGE: ${{ vars.TV_EXCHANGE }}
          TZ_NAME: ${{ vars.TZ_NAME }}
          XS: ${{ vars.XS }}
          XS_TFS: ${{ vars.XS_TFS }}
          XS_MIN: ${{ vars.XS_MIN }}
          XS_MIN_30M: ${{ vars.XS_MIN_30M }}
          XS_MIN_1H: ${{ vars.XS_MIN_1H }}
          XS_MIN_4H: ${{ vars.XS_MIN_4H }}
          XS_MIN_1D: ${{ vars.XS_MIN_1D }}
          XS_SELL: ${{ vars.XS_SELL }}
          XS_SELL_MIN: ${{ vars.XS_SELL_MIN }}
          XS_MAX: ${{ vars.XS_MAX }}
          XS_LOOKBACK: ${{ vars.XS_LOOKBACK }}
          XS_NEED_EXT: ${{ vars.XS_NEED_EXT }}
          XS_ZONES: ${{ vars.XS_ZONES }}
          XS_ZONE_BELOW_ATR: ${{ vars.XS_ZONE_BELOW_ATR }}
          XS_ZONE_MAX_ATR: ${{ vars.XS_ZONE_MAX_ATR }}
          XS_ZONE_TOL_ATR: ${{ vars.XS_ZONE_TOL_ATR }}
          XS_ZONE_LIFE: ${{ vars.XS_ZONE_LIFE }}
          XS_ZONE_FIB: ${{ vars.XS_ZONE_FIB }}
          XS_STOP_ATR: ${{ vars.XS_STOP_ATR }}
        run: |
          case "$MODE" in
            selftest) python xs_scanner.py --selftest ;;
            dryrun)   python xs_scanner.py --dry-run --all-tfs --lookback 6 --ignore-state ;;
            sendlast) python xs_scanner.py --all-tfs --lookback 6 --ignore-state ;;
            *)        python xs_scanner.py ;;
          esac
